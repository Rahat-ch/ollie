# Every push and pull request: typecheck, lint, the unit tests, the fake
# eval, the production build, and a check that the browser's bundle
# carries no LangGraph code; and the Docker image Coolify deploys. No secret is read here, so the fake eval
# runs with no key and makes no network call.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # the version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm eval --fake
      - run: pnpm build
      - run: pnpm bundle:check # no LangGraph code in the browser's bundle

  # The image Coolify deploys, built from the same Dockerfile and build
  # context (.dockerignore), so a file the build needs but the context
  # leaves out fails here rather than at deploy. It is built, not pushed.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag ollie-ci .
