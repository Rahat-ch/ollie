<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Andika:wght@400;700&display=swap">
  <style>
    body { margin: 0; background: #FFF7EC; color: #3B2E2A; font-family: Andika, Verdana, sans-serif; }
    * { box-sizing: border-box; }
    a { color: #3F8FB4; } a:hover { color: #2E5E6B; }
    .display { font-family: Fredoka, "Trebuchet MS", sans-serif; font-weight: 600; }
    .cap { font-size: 15px; line-height: 1.4; color: #7A6660; }
  </style>
</helmet>
<div style="width:1024px;height:768px;background:#FFF7EC;overflow:hidden;position:relative;">

  <!-- Parent Gate: press and hold -->
  <div style="position:absolute;left:32px;top:24px;height:56px;padding:0 20px 0 14px;border-radius:999px;background:#F8E8CF;box-shadow:0 3px 0 #EED7B5;display:flex;align-items:center;gap:10px;">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#3B2E2A" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="3"></rect><path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3"></path></svg>
    <span style="font-family: Andika, Verdana, sans-serif;font-size:15px;line-height:1.4;color:#7A6660;">Hold for grown-ups</span>
  </div>

  <!-- Avatar, Coins, Streak -->
  <div style="position:absolute;right:32px;top:24px;display:flex;align-items:center;gap:12px;">
    <div class="display" style="display:flex;align-items:center;gap:8px;height:56px;padding:0 20px 0 14px;border-radius:999px;background:#F8E8CF;box-shadow:0 3px 0 #EED7B5;font-size:24px;line-height:1;">
      <svg viewBox="0 0 24 24" width="28" height="28" stroke="#3B2E2A" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round"><circle cx="12" cy="12" r="9" fill="#F2B134"></circle><circle cx="12" cy="12" r="4" fill="none"></circle></svg>
      <span>40</span>
    </div>
    <div class="display" style="display:flex;align-items:center;gap:8px;height:56px;padding:0 20px 0 14px;border-radius:999px;background:#F8E8CF;box-shadow:0 3px 0 #EED7B5;font-size:24px;line-height:1;">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="#4CAF7A" stroke="#3B2E2A" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1.5 3.2 5.5 5.6 5.5 10a5.5 5.5 0 0 1-11 0c0-2.3 1.2-3.7 2.4-4.9.2 1.7.9 2.7 2 3C10.3 8.4 10 6 12 3z"></path></svg>
      <span>3</span>
    </div>
    <svg viewBox="0 0 80 80" width="72" height="72" aria-label="Avatar">
      <path d="M22 18 Q40 6 58 18" fill="none" stroke="#EED7B5" stroke-width="3" stroke-dasharray="5 5" stroke-linecap="round"></path>
      <ellipse cx="42" cy="49" rx="30" ry="27" fill="#EED7B5"></ellipse>
      <ellipse cx="40" cy="46" rx="30" ry="27" fill="#F8DFB8"></ellipse>
      <circle cx="30" cy="42" r="4" fill="#3B2E2A"></circle>
      <circle cx="50" cy="42" r="4" fill="#3B2E2A"></circle>
      <path d="M32 55 Q40 62 48 55" fill="none" stroke="#3B2E2A" stroke-width="3" stroke-linecap="round"></path>
    </svg>
  </div>

  <!-- Ollie's greeting -->
  <div style="position:absolute;left:48px;top:120px;display:flex;flex-direction:column;align-items:flex-start;">
    <div class="display" style="padding:20px 28px;border-radius:28px;background:#F8E8CF;box-shadow:0 3px 0 #EED7B5;font-size:32px;line-height:1.15;max-width:400px;">Hi Mia! Ready to play?</div>
    <svg viewBox="0 0 40 28" width="40" height="28" style="margin-left:36px;"><path d="M0 0h40L10 28z" fill="#F8E8CF"></path></svg>
  </div>

  <!-- Ollie -->
  <img src="ollie-idle.svg" style="position:absolute;left:32px;bottom:24px;width:220px;height:220px;">

  <!-- Path -->
  <div style="position:absolute;left:300px;top:250px;width:692px;height:260px;">
    <svg viewBox="0 0 692 260" width="692" height="260" style="position:absolute;left:0;top:0;" fill="none">
      <path d="M96 150 C 200 40, 260 40, 346 118 S 520 220, 596 120" stroke="#6FB7D6" stroke-width="10" stroke-linecap="round" stroke-dasharray="1 22"></path>
    </svg>
    <div style="position:absolute;left:0;top:96px;width:192px;display:flex;flex-direction:column;align-items:center;gap:8px;">
      <div style="width:108px;height:108px;border-radius:999px;background:#4CAF7A;box-shadow:0 4px 0 #2F8A5B;display:flex;align-items:center;justify-content:center;">
        <svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="#3B2E2A" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
      </div>
      <div class="cap">Unit 1</div>
      <div class="display" style="font-size:24px;line-height:1.2;text-align:center;">Partners to 10</div>
    </div>
    <div style="position:absolute;left:250px;top:64px;width:192px;display:flex;flex-direction:column;align-items:center;gap:8px;">
      <div style="position:relative;width:132px;height:132px;border-radius:999px;background:#FFF7EC;box-shadow:0 0 0 6px #F2B134;display:flex;align-items:center;justify-content:center;">
        <div style="width:108px;height:108px;border-radius:999px;background:#F2B134;box-shadow:0 4px 0 #D0901E;display:flex;align-items:center;justify-content:center;">
          <img src="ollie-head.svg" style="width:72px;height:72px;">
        </div>
        <div class="display" style="position:absolute;right:-70px;top:-6px;display:flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 8px;border-radius:999px;background:#6B4E9C;box-shadow:0 3px 0 #4E3676;color:#FFF7EC;font-size:15px;line-height:1;white-space:nowrap;">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="#F2B134" stroke="#FFF7EC" stroke-opacity="0.6" stroke-width="3" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg>
          <span>Count-On Flight</span>
        </div>
      </div>
      <div class="cap">Unit 2 · now</div>
      <div class="display" style="font-size:24px;line-height:1.2;text-align:center;">Counting on and make-a-ten</div>
    </div>
    <div style="position:absolute;left:500px;top:70px;width:192px;display:flex;flex-direction:column;align-items:center;gap:8px;">
      <div style="width:108px;height:108px;border-radius:999px;background:#EED7B5;display:flex;align-items:center;justify-content:center;">
        <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="#3B2E2A" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="3"></rect><path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3"></path></svg>
      </div>
      <div class="cap">Unit 3</div>
      <div class="display" style="font-size:24px;line-height:1.2;text-align:center;color:#7A6660;">Word problems</div>
    </div>
  </div>

  <!-- Play -->
  <div class="display" style="position:absolute;left:372px;bottom:48px;width:280px;height:96px;border-radius:28px;background:#F2B134;box-shadow:0 4px 0 #D0901E;display:flex;align-items:center;justify-content:center;gap:16px;font-size:44px;line-height:1.1;color:#3B2E2A;">
    <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#3B2E2A" stroke-opacity="0.6" stroke-width="3" stroke-linejoin="round"><path d="M8 5.5v13l10-6.5z"></path></svg>
    <span>Play</span>
  </div>

  <!-- Shop -->
  <div class="display" style="position:absolute;right:32px;bottom:64px;height:64px;padding:0 24px 0 18px;border-radius:28px;background:#6FB7D6;box-shadow:0 4px 0 #3F8FB4;display:flex;align-items:center;justify-content:center;gap:10px;font-size:24px;line-height:1.2;color:#3B2E2A;">
    <svg viewBox="0 0 24 24" width="28" height="28" stroke="#3B2E2A" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round"><circle cx="12" cy="12" r="9" fill="#F2B134"></circle><circle cx="12" cy="12" r="4" fill="none"></circle></svg>
    <span>Shop</span>
  </div>

</div>
</x-dc>
</body>
</html>
