ignoredBuiltDependencies:
  - unrs-resolver

# sharp pulls in a prebuilt libvips binary under LGPL-3.0, which the hackathon
# terms prohibit. It only serves next/image optimisation, which Ollie does not
# use (SVG-first). Removing it here keeps the tree free of LGPL code; the
# matching `images.unoptimized` flag lives in next.config.ts.
overrides:
  sharp: "-"
